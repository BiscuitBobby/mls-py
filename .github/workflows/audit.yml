name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: new advisories appear without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit --deny warnings
      - name: Advisories for git-pinned mls-rs crates (invisible to cargo audit)
        run: scripts/audit_git_pins.sh
      - run: cargo deny check
      - run: cargo install --locked --features cli cargo-about@0.9.2
      - name: THIRD_PARTY_NOTICES.txt matches Cargo.lock
        run: scripts/gen_notices.sh --check

  fuzz-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_message, process, join, key_package]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install --locked cargo-fuzz
      - name: Fuzz ${{ matrix.target }} for 5 minutes
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: "fuzz-artifacts-${{ matrix.target }}", path: fuzz/artifacts }
