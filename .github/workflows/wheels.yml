# Build abi3 wheels + sdist, test every wheel on every supported Python, and
# (on version tags only, behind the `pypi` environment) publish with PyPI
# trusted publishing; a manual run with `testpypi` set publishes to TestPyPI
# instead. Third-party actions are pinned to commit SHAs (tag in comment).
name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish the built distributions to TestPyPI (dry run of a release)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  MATURIN_VERSION: "1.15.0"

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain   # installs the rust-toolchain.toml pin
      - run: scripts/verify_deps.sh
      - name: Cross-implementation interop (OpenMLS)
        run: cd interop && cargo test --locked

  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          # glibc 2.28 baseline (RHEL 8, Debian 10, Ubuntu 18.10 and later).
          manylinux: "2_28"
          args: --release --locked --out dist
      - name: Inspect wheel dependencies
        run: pipx run auditwheel show dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "wheel-linux-${{ matrix.target }}", path: dist }

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Separate wheels per architecture; no universal2 claim.
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - run: otool -L target/*/release/lib_mls_py.dylib || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "wheel-macos-${{ matrix.target }}", path: dist }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: x64
          args: --release --locked --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "wheel-windows-x64", path: dist }

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: sdist, path: dist }

  # abi3 means one wheel per platform, but it is tested on every Python, not assumed.
  test:
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python }}", allow-prereleases: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "wheel-*", path: dist, merge-multiple: true }
      - name: Install wheel in a clean venv and run the suite
        shell: bash
        run: |
          python -m venv /tmp/venv || python -m venv venv
          if [ -d /tmp/venv ]; then VENV=/tmp/venv; else VENV=venv; fi
          if [ -x "$VENV/Scripts/python.exe" ]; then PY="$VENV/Scripts/python.exe"; else PY="$VENV/bin/python"; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --no-index --find-links dist mls_py
          "$PY" -m pip install "pytest>=8" "hypothesis>=6"
          cd tests && "$PY" -m pytest -q -p no:cacheprovider --rootdir=. .

  sdist-build-test:
    needs: [sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: sdist, path: dist }
      - run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.tar.gz "pytest>=8" "hypothesis>=6"
          cd tests && /tmp/venv/bin/python -m pytest -q -p no:cacheprovider --rootdir=. .

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-tests, test, sdist-build-test]
    runs-on: ubuntu-latest
    environment: pypi          # configure required reviewers on this environment
    permissions:
      id-token: write          # PyPI trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with: { packages-dir: dist }

  # Manual dry run: same artifacts, uploaded to TestPyPI instead. TestPyPI
  # refuses a version it already has, so each dry run needs a fresh version.
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    needs: [rust-tests, test, sdist-build-test]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with: { packages-dir: dist, repository-url: "https://test.pypi.org/legacy/" }
