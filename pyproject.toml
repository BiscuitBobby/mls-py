[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "mls-py"
version = "0.1.0"
description = "Minimal Python binding for mls-rs, an implementation of Messaging Layer Security (RFC 9420)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["mls", "rfc9420", "messaging-layer-security", "e2ee", "cryptography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.maturin]
manifest-path = "crates/mls-py/Cargo.toml"
module-name = "mls_py._mls_py"
python-source = "python"
features = ["pyo3/extension-module"]
locked = true
strip = true
include = [{ path = "LICENSE", format = "sdist" }, { path = "SECURITY.md", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
